name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

# Workflow-level so the build job can self-enable Pages too. Scoping
# `pages: write` to the deploy job alone makes `configure-pages` fail there.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Attempts to turn Pages on automatically. If the token lacks
          # permission, enable it manually: Settings → Pages → Source:
          # "GitHub Actions".
          enablement: true

      - name: Remove server-only routes
        # `output: "export"` cannot build a POST route handler — there is no
        # server on Pages to run it. The tutor chat detects the static build
        # and explains its absence rather than calling a dead endpoint.
        run: rm -rf src/app/api

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          # A project site is served from /<repo>/, so assets need the prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add .nojekyll
        # Jekyll ignores directories beginning with an underscore, which would
        # drop Next's entire _next/ asset folder. Harmless insurance here, and
        # required if you ever switch to branch-based publishing.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
